name: ci

# Deterministic checks only: no API keys, no model downloads, no LLM calls. The unit suite
# includes the verifier, refusal-policy and adversarial-harness regression tests, which run
# against scripted LLMs and NLI stand-ins.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Security and verification regression gate
        # Blocking, deterministic: unsupported and partly supported claims, invalid,
        # fabricated and untrusted citations, quote mismatches, refusal policy, poisoned
        # retrieval and tool output (delivery, adoption, attribution), nonexistent provision
        # references, and the web API. Scripted LLMs and NLI stand-ins: this checks the
        # pipeline's rules, not a model's faithfulness on new questions.
        run: >-
          uv run pytest tests/unit/test_verification.py tests/unit/test_conjuncts.py
          tests/unit/test_policy.py tests/unit/test_refusal_eval.py tests/unit/test_adversarial.py
          tests/unit/test_provisions.py tests/unit/test_api.py
      - name: Full test suite
        run: uv run pytest

  docker-build:
    # Builds the API image (CPU torch, nothing is pushed) and runs it: scripts/docker_smoke.py
    # starts the container without index, models or LLM and checks liveness, the honest
    # not-ready report, the UI and OpenAPI, the non-root user and that no .env or index is
    # baked in. Answer quality is not tested here (no models, no LLM).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yaml
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: citeshield:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: python3 scripts/docker_smoke.py --image citeshield:ci --skip-build
