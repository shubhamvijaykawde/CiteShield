name: eval-gate

# Optional, manually started model-quality gate: a smoke answer eval against Claude, compared
# with eval/baselines/anthropic.json (faithfulness, citation precision, refusal F1, schema
# validity; thresholds in src/citeshield/evaluation/gate.py).
#
# It is NOT part of the required pull-request CI (.github/workflows/ci.yml), because it needs
# a paid API key, the retrieval index (published as a release asset index-<corpus_hash>, see
# README) and a recorded baseline. If any of these is missing the run FAILS with an
# explanation; it never turns into a passing no-op. The LLM judge is optional and
# informational: it has not met its calibration target.

on:
  workflow_dispatch:
    inputs:
      subset:
        description: "smoke or full"
        default: "smoke"
        type: choice
        options: [smoke, full]
      judge:
        description: "Also run the (uncalibrated, informational) LLM judge"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      SUBSET: ${{ inputs.subset }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        run: |
          missing=0
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The ANTHROPIC_API_KEY repository secret is not set."; missing=1
          fi
          if [ ! -f eval/baselines/anthropic.json ]; then
            echo "::error::eval/baselines/anthropic.json does not exist. Record one with citeshield-eval-gate --write-baseline."; missing=1
          fi
          exit $missing

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra ml

      - name: Download the retrieval index for this corpus
        run: |
          hash=$(uv run python -c "from citeshield.config import Settings; from citeshield.contracts.chunk import corpus_hash; from citeshield.retrieval.corpus import Corpus; print(corpus_hash(Corpus.load(Settings().chunks_path)))")
          echo "corpus hash: $hash"
          gh release download "index-$hash" --pattern index.tar.gz --dir /tmp
          tar -xzf /tmp/index.tar.gz -C data

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: .hf
          key: hf-${{ hashFiles('src/citeshield/retrieval/config.py', 'src/citeshield/verify/config.py') }}

      - name: Run the answer eval
        run: |
          judge=""
          if [ "${{ inputs.judge }}" = "true" ]; then judge="--judge"; fi
          uv run citeshield-eval --subset "$SUBSET" --run-id "$RUN_ID" $judge

      - name: Gate (1 = regression, 2 = not comparable; both fail)
        run: |
          set +e
          uv run citeshield-eval-gate "eval/runs/$RUN_ID/metrics.json" --markdown gate.md
          code=$?
          cat gate.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ env.RUN_ID }}
          path: eval/runs/${{ env.RUN_ID }}
          if-no-files-found: ignore
