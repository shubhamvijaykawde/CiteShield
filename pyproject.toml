[project]
name = "citeshield"
version = "0.1.0"
description = "Cited, injection-resistant agent for EU regulation compliance questions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "lxml>=5.3",
    "pyyaml>=6.0",
    "qdrant-client>=1.12",
    "numpy>=1.26",
    "anthropic>=2.0.0",
    "langgraph>=1.2.16",
    "fastapi>=0.158.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Model inference. Kept optional so lint/unit CI does not pull torch.
ml = [
    "torch>=2.6",
    "transformers>=4.46",
    "huggingface-hub>=0.25",
]

[project.scripts]
citeshield-ingest = "citeshield.ingest.run:main"
citeshield-index = "citeshield.retrieval.cli:index_main"
citeshield-search = "citeshield.retrieval.cli:search_main"
citeshield-eval-retrieval = "citeshield.evaluation.retrieval:main"
citeshield-ask = "citeshield.agent.cli:main"
citeshield-calibrate-verifier = "citeshield.evaluation.verifier_calibration:main"
citeshield-eval = "citeshield.evaluation.run_eval:main"
citeshield-eval-gate = "citeshield.evaluation.gate:main"
citeshield-label = "citeshield.evaluation.labeling:main"
citeshield-calibrate-judge = "citeshield.evaluation.judge_calibration:main"

# CUDA wheels on the Windows dev box (local GPU indexing); CPU wheels on Linux (CI, Docker, HF Spaces).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "lxml-stubs",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citeshield"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests
# The Official Journal uses typographic quotes; parsers and tests must match them literally.
allowed-confusables = ["‘", "’", "›"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests need local services (Ollama, GPU index) and are opt-in: `pytest -m live`.
addopts = "-q -m 'not live and not nli'"
markers = [
    "live: needs a running local Ollama server and the built retrieval index (opt-in)",
    "nli: needs the downloaded NLI model weights and the processed corpus (opt-in)",
    "model_quality: live test whose outcome depends on the model's choices, not only on code (can fail intermittently)",
]
